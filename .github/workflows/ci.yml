name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit and leakage tests
        run: python -m pytest -v
      - name: Re-run modelling from committed processed data
        run: |
          if [ -f data/processed/quarterly_revenue.csv ]; then
            python -m forecastlab offline
          else
            echo "No committed processed data yet; skipping offline rerun."
          fi
